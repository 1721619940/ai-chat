version: "3.9"

services:
  server:
    build: ./server
    container_name: ai-chat-server
    env_file:
      - ./server/.env
    ports:
      - "5500:5500"
    restart: unless-stopped

  client:
    build: ./client
    container_name: ai-chat-client
    environment:
      - VITE_API_URL=http://localhost:5500
    ports:
      - "5173:5173"
    depends_on:
      - server
    restart: unless-stopped
